; Standalone IVR test context. Requires local audio files and an allowlisted
; test-only PJSIP trunk. Never route Shopify orders into this context.

[talwar-ivr-test]
exten => s,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=talwar-ivr-test-hangup,s,1)
 same => n,UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:answered)
 same => n,Playback(${IVR_GREETING})
 same => n,Read(ORDER_KEY,talwar/order-choice,1,,1,8)
 same => n,GotoIf($["${ORDER_KEY}"="1"]?order_yes)
 same => n,GotoIf($["${ORDER_KEY}"="2"]?order_no)
 same => n,GotoIf($["${READSTATUS}"="TIMEOUT"]?order_retry_no_input:order_retry_invalid)
 same => n(order_retry_no_input),Playback(talwar/no-input-retry)
 same => n,Goto(order_retry)
 same => n(order_retry_invalid),Playback(talwar/invalid-input)
 same => n(order_retry),Read(ORDER_KEY,talwar/order-choice,1,,1,8)
 same => n,GotoIf($["${ORDER_KEY}"="1"]?order_yes)
 same => n,GotoIf($["${ORDER_KEY}"="2"]?order_no)
 same => n,GotoIf($["${READSTATUS}"="TIMEOUT"]?order_no_input:order_invalid)
 same => n(order_no_input),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:no_input)
 same => n,Hangup()
 same => n(order_invalid),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:invalid_input)
 same => n,Hangup()
 same => n(order_no),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:order_2)
 same => n,Playback(talwar/order-cancelled)
 same => n,Hangup()
 same => n(order_yes),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:order_1)
 same => n,Playback(${IVR_ADDRESS})
 same => n,Read(ADDRESS_KEY,talwar/address-choice,1,,1,8)
 same => n,GotoIf($["${ADDRESS_KEY}"="1"]?address_yes)
 same => n,GotoIf($["${ADDRESS_KEY}"="2"]?address_no)
 same => n,GotoIf($["${READSTATUS}"="TIMEOUT"]?address_retry_no_input:address_retry_invalid)
 same => n(address_retry_no_input),Playback(talwar/no-input-retry)
 same => n,Goto(address_retry)
 same => n(address_retry_invalid),Playback(talwar/invalid-input)
 same => n(address_retry),Read(ADDRESS_KEY,talwar/address-choice,1,,1,8)
 same => n,GotoIf($["${ADDRESS_KEY}"="1"]?address_yes)
 same => n,GotoIf($["${ADDRESS_KEY}"="2"]?address_no)
 same => n,GotoIf($["${READSTATUS}"="TIMEOUT"]?address_no_input:address_invalid)
 same => n(address_no_input),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:no_input)
 same => n,Hangup()
 same => n(address_invalid),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:invalid_input)
 same => n,Hangup()
 same => n(address_no),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:address_2)
 same => n,Playback(talwar/address-needs-review)
 same => n,Hangup()
 same => n(address_yes),UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:address_1)
 same => n,Playback(talwar/order-confirmed)
 same => n,Hangup()

[talwar-ivr-test-hangup]
exten => s,1,UserEvent(TalwarIvr,AttemptId:${IVR_ATTEMPT_ID},Kind:hangup)
 same => n,Return()
