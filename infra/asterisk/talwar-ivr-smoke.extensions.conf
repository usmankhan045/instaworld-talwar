; Internal-only FreePBX custom context for phase 1 host verification.
; Install by appending to /etc/asterisk/extensions_custom.conf on the test PBX.
; The result event is emitted by the hangup handler, including mid-call drops.

[talwar-ivr-smoke]
exten => s,1,Answer()
 same => n,Set(TALWAR_RESULT=interrupted)
 same => n,Set(CHANNEL(hangup_handler_push)=talwar-ivr-smoke-hangup,s,1)
 same => n,Read(TALWAR_DIGIT,beep,1,,1,6)
 same => n,GotoIf($["${READSTATUS}"="OK"]?digit-received)
 same => n,Set(TALWAR_RESULT=${READSTATUS})
 same => n,Hangup()
 same => n(digit-received),Set(TALWAR_RESULT=key_${TALWAR_DIGIT})
 same => n,Hangup()

[talwar-ivr-smoke-hangup]
exten => s,1,UserEvent(TalwarIvrSmoke,Result:${TALWAR_RESULT},ReadStatus:${READSTATUS},Uniqueid:${UNIQUEID})
 same => n,Return()
